name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Annule les exécutions précédentes encore en cours sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Postgres réel : les tests e2e (auth.e2e.spec.ts) tournent contre une vraie DB.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: facturation
          POSTGRES_PASSWORD: facturation
          POSTGRES_DB: facturation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facturation -d facturation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valeurs de TEST (pas des secrets de production) — sûres à versionner.
    env:
      DATABASE_URL: postgresql://facturation:facturation@localhost:5432/facturation
      JWT_ACCESS_SECRET: ci-access-secret-not-for-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod
      ADMIN_EMAIL: admin@facturation.local
      ADMIN_PASSWORD: ci-admin-password
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fichier .env attendu par les scripts db (dotenv-cli) et par ConfigModule.
      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          NODE_ENV=$NODE_ENV
          EOF

      - name: Build (turbo — génère le client Prisma + compile les packages)
        run: npm run build

      - name: Apply migrations
        run: npm run -w @facturation/db db:deploy

      - name: Seed (utilisateur admin)
        run: npm run -w @facturation/db db:seed

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test (unit + e2e)
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: facturation
          POSTGRES_PASSWORD: facturation
          POSTGRES_DB: facturation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facturation -d facturation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://facturation:facturation@localhost:5432/facturation
      JWT_ACCESS_SECRET: ci-access-secret-not-for-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod
      ADMIN_EMAIL: admin@facturation.local
      ADMIN_PASSWORD: ci-admin-password
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          NODE_ENV=$NODE_ENV
          EOF

      - name: Build
        run: npm run build

      - name: Apply migrations + seed
        run: |
          npm run -w @facturation/db db:deploy
          npm run -w @facturation/db db:seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (app + Playwright)
        env:
          E2E_EMAIL: ${{ env.ADMIN_EMAIL }}
          E2E_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          # Démarre l'API (dist) et le web (vite) en arrière-plan.
          ( cd apps/api && API_PORT=4001 node dist/main.js ) &
          npm run -w @facturation/web dev &
          # Attend que les deux répondent (max ~60 s).
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4001/health || true)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000 || true)
            [ "$api" = "200" ] && [ "$web" = "200" ] && break
            sleep 2
          done
          npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # Le desktop (Electron) n'est pas un workspace npm : install + type-check dédiés.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install desktop deps
        run: npm --prefix desktop ci

      - name: Type-check desktop
        run: npm --prefix desktop run typecheck
