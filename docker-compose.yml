services:
  postgres:
    image: postgres:16-alpine
    container_name: facturation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: facturation
      POSTGRES_PASSWORD: facturation
      POSTGRES_DB: facturation
    ports:
      - "5432:5432"
    volumes:
      - facturation-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturation -d facturation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  facturation-pgdata:
