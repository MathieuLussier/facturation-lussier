appId: com.lussier.facturation
productName: Facturation Lussier

directories:
  output: release
  buildResources: build

# Contenu empaqueté (ASAR). Le code TS compilé vit dans dist/.
files:
  - dist/**/*
  - "!**/*.ts"
  - "!**/*.map"

# wia.ps1 doit rester un fichier accessible hors ASAR à l'exécution.
extraResources:
  - from: src/scan/wia.ps1
    to: scan/wia.ps1

# ── Mises à jour automatiques (provider generic = ton serveur) ───────────────
# TODO: remplace l'URL par l'emplacement réel sur ton VPS où tu déposeras
# latest.yml + le .exe + le .blockmap (voir README).
publish:
  - provider: generic
    url: https://factures.lussier.app/desktop/releases/

# ── Cible Windows ────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  # Signature : fournir CSC_LINK (chemin/-base64 du .pfx) + CSC_KEY_PASSWORD
  # en variables d'environnement au moment du build. Sans elles, build non signé.
  signingHashAlgorithms:
    - sha256
  timeStampServer: http://timestamp.sectigo.com

# ── Installeur NSIS (one-click + auto-update) ────────────────────────────────
nsis:
  oneClick: true
  perMachine: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Facturation Lussier
  artifactName: "${productName}-Setup-${version}.${ext}"
  unicode: true
  runAfterFinish: true
